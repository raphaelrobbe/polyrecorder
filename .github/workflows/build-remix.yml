name: Build Remix (refacto-remix)

on:
  push:
    branches: [refacto-remix]
  pull_request:
    branches: [refacto-remix]
  workflow_dispatch:

concurrency:
  group: remix-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
