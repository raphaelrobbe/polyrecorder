name: Deploy Scaleway

# Build the Remix SSR image on GitHub Actions and push it to Scaleway Container
# Registry, then trigger a Serverless Container redeploy.
# Go-live: switch `branches` to `main` and retire deploy-pages.yml.

on:
  push:
    branches: [refacto-remix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-scaleway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.SCW_DOCKER_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.SCW_DOCKER_REGISTRY }}/polyrecorder:latest
            ${{ secrets.SCW_DOCKER_REGISTRY }}/polyrecorder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Scaleway container
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SCW_CONTAINER_ID:-}" ]; then
            echo "SCW_CONTAINER_ID unset — image pushed only; skip redeploy."
            exit 0
          fi
          curl -fsS -X POST \
            "https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers/${SCW_CONTAINER_ID}/deploy" \
            -H "X-Auth-Token: ${SCW_SECRET_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
