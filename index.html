<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyRecorder</title>
    <script>
      (() => {
        try {
          const pref = localStorage.getItem('polyrecorder-theme')
          const dark =
            pref === 'dark' ||
            (pref !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.classList.toggle('light', !dark)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (_) {}
        try {
          const stored = localStorage.getItem('polyrecorder-locale')
          const known = new Set(['fr', 'en', 'de', 'no'])
          const aliases = { nb: 'no', nn: 'no' }
          let locale =
            stored && known.has(stored) ? stored : null
          if (!locale) {
            const langs = navigator.languages?.length
              ? navigator.languages
              : [navigator.language]
            for (const raw of langs) {
              const tag = String(raw || '').toLowerCase()
              const primary = tag.split('-')[0] || tag
              if (known.has(primary)) {
                locale = primary
                break
              }
              if (aliases[primary]) {
                locale = aliases[primary]
                break
              }
            }
          }
          document.documentElement.lang = locale || 'en'
        } catch (_) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
