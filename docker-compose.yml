# Local Postgres for PolyRecorder (dev only).
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v

services:
  postgres:
    image: postgres:17-alpine
    container_name: polyrecorder-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: polyrecorder
      POSTGRES_PASSWORD: polyrecorder
      POSTGRES_DB: polyrecorder
    volumes:
      - polyrecorder_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polyrecorder -d polyrecorder']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polyrecorder_pg:
